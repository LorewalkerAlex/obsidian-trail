name: Release Trail

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:verify -- "$GITHUB_REF_NAME"

      - name: Run release checks
        run: npm run check

      - name: Verify release assets
        run: |
          test -f .obsidian/plugins/trail/main.js
          test -f .obsidian/plugins/trail/manifest.json
          test -f .obsidian/plugins/trail/styles.css
          cmp -s manifest.json .obsidian/plugins/trail/manifest.json

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            .obsidian/plugins/trail/main.js \
            .obsidian/plugins/trail/manifest.json \
            .obsidian/plugins/trail/styles.css
